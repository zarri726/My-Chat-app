
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Chat App</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .box {
      background: white;
      padding: 25px;
      width: 85%;
      max-width: 350px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 15px #ccc;
    }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      box-sizing: border-box;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: none;
      background: #1877f2;
      color: white;
      cursor: pointer;
    }
    #status { margin-top: 15px; color: #444; }
  </style>
</head>
<body>
  <div class="box">
    <h2>My Chat 💬</h2>
    <p>Welcome to My Chat App</p>
    <input id="phone" type="tel" placeholder="+923001234567">
    <div id="recaptcha-container"></div>
    <button id="sendOTP">Send OTP</button>
    <input id="otp" type="text" placeholder="Enter OTP">
    <button id="verifyOTP">Verify OTP</button>
    <p id="status">Enter your phone number</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import {
      getAuth,
      RecaptchaVerifier,
      signInWithPhoneNumber
    } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAJCkejiSop-zYHtf-bizFxwDxbhPtcYxI",
      authDomain: "mychatapp-2876b.firebaseapp.com",
      projectId: "mychatapp-2876b",
      storageBucket: "mychatapp-2876b.firebasestorage.app",
      messagingSenderId: "859851192412",
      appId: "1:859851192412:web:44e50d268d1f96fe168e99",
      measurementId: "G-M8T510K10L"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let confirmationResult;

    const status = document.getElementById("status");

    window.recaptchaVerifier = new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      { size: "normal" }
    );

    document.getElementById("sendOTP").onclick = async () => {
      try {
        const phone = document.getElementById("phone").value.trim();
        confirmationResult = await signInWithPhoneNumber(
          auth, phone, window.recaptchaVerifier
        );
        status.textContent = "OTP sent successfully!";
      } catch (error) {
        status.textContent = error.message;
      }
    };

    document.getElementById("verifyOTP").onclick = async () => {
      try {
        const otp = document.getElementById("otp").value.trim();
        await confirmationResult.confirm(otp);
        status.textContent = "Login Successful! 🎉";
      } catch (error) {
        status.textContent = error.message;
      }
    };
  </script>
</body>
</html>
