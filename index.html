
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Chat App</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2f8;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.box {
  background: white;
  width: 100%;
  max-width: 420px;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 5px 25px #ccd2df;
}

h2 { text-align: center; color: #1877f2; }

input {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border: none;
  border-radius: 9px;
  background: #1877f2;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

.secondary { background: #555; }
.danger { background: #e74c3c; }

#chatScreen { display: none; }

#messages {
  height: 300px;
  overflow-y: auto;
  background: #f2f5fa;
  padding: 10px;
  border-radius: 10px;
  margin: 12px 0;
}

.message {
  background: white;
  padding: 10px;
  border-radius: 10px;
  margin: 8px 0;
  overflow-wrap: anywhere;
}

#status {
  text-align: center;
  font-size: 13px;
  color: #555;
}
</style>
</head>

<body>

<div class="box">

<div id="authScreen">
<h2>My Chat 💬</h2>
<p style="text-align:center">Welcome to My Chat App</p>

<input id="email" type="email" placeholder="Enter Email">
<input id="password" type="password" placeholder="Enter Password">

<button id="signup">Create Account</button>
<button id="login">Login</button>
<button id="forgot" class="secondary">Forgot Password?</button>

<p id="status">Create an account or Login</p>
</div>

<div id="chatScreen">
<h2>My Chat 💬</h2>
<p id="userEmail"></p>

<div id="messages"></div>

<input id="messageInput" placeholder="Write a message...">
<button id="sendMessage">Send Message</button>
<button id="logout" class="danger">Logout</button>

<p id="chatStatus"></p>
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendPasswordResetEmail,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAJCkejiSop-zYHtf-bizFxwDxbhPtcYxI",
authDomain: "mychatapp-2876b.firebaseapp.com",
projectId: "mychatapp-2876b",
storageBucket: "mychatapp-2876b.firebasestorage.app",
messagingSenderId: "859851192412",
appId: "1:859851192412:web:44e50d268d1f96fe168e99",
measurementId: "G-M8T510K10L"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let stopMessages = null;

$("signup").onclick = async () => {
try {
const email = $("email").value.trim();
const password = $("password").value;

await createUserWithEmailAndPassword(auth,email,password);

$("status").textContent = "Account Created Successfully!";
} catch(error) {
$("status").textContent = error.message;
}
};

$("login").onclick = async () => {
try {
const email = $("email").value.trim();
const password = $("password").value;

await signInWithEmailAndPassword(auth,email,password);

$("status").textContent = "Login Successful!";
} catch(error) {
$("status").textContent = error.message;
}
};

$("forgot").onclick = async () => {
try {
const email = $("email").value.trim();

if(!email) {
$("status").textContent = "Enter your email first";
return;
}

await sendPasswordResetEmail(auth,email);

$("status").textContent = "Password reset email sent!";
} catch(error) {
$("status").textContent = error.message;
}
};

onAuthStateChanged(auth, user => {

if(user) {
$("authScreen").style.display = "none";
$("chatScreen").style.display = "block";
$("userEmail").textContent = user.email;

loadMessages();

} else {
$("authScreen").style.display = "block";
$("chatScreen").style.display = "none";

if(stopMessages) {
stopMessages();
stopMessages = null;
}
}
});

function loadMessages() {

if(stopMessages) stopMessages();

const q = query(
collection(db,"messages"),
orderBy("createdAt","asc")
);

stopMessages = onSnapshot(q, snapshot => {

$("messages").innerHTML = "";

snapshot.forEach(doc => {

const data = doc.data();

const div = document.createElement("div");
div.className = "message";

const sender = document.createElement("strong");
sender.textContent = data.Sender || "User";

const text = document.createElement("p");
text.textContent = data.Text || "";

div.appendChild(sender);
div.appendChild(text);

$("messages").appendChild(div);

});

$("messages").scrollTop = $("messages").scrollHeight;

}, error => {
$("chatStatus").textContent = error.message;
});
}

$("sendMessage").onclick = async () => {

try {
const message = $("messageInput").value.trim();

if(!message) return;

await addDoc(collection(db,"messages"), {
Sender: auth.currentUser.email,
Text: message,
createdAt: serverTimestamp()
});

$("messageInput").value = "";
$("chatStatus").textContent = "";

} catch(error) {
$("chatStatus").textContent = error.message;
}
};

$("logout").onclick = async () => {
await signOut(auth);
};

</script>

</body>
</html>
